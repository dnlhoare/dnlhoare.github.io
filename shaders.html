<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Shader Sandbox</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; font-family: sans-serif; background: #111; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 2; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; width: 350px; }
        textarea { width: 100%; height: 200px; background: #222; color: #0f0; border: 1px solid #444; font-family: monospace; padding: 8px; resize: vertical; }
        select, button { width: 100%; margin-top: 10px; padding: 8px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; }
        button:hover { background: #444; }
        .error { color: #ff5555; font-size: 12px; margin-top: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui">
        <h3>Shader Sandbox</h3>
        <label>Select Demo Shader:</label>
        <select id="shaderSelect" onchange="loadDemo()">
            <option value="plasma">Plasma Waves</option>
            <option value="circles">Moving Circles</option>
            <option value="rings">Neon Rings</option>
            <option value="aurora">Aurora Bands</option>
            <option value="starfield">Warp Starfield</option>
            <option value="checker">Flowing Checkerboard</option>
            <option value="marble">Liquid Marble</option>
            <option value="ripple">Water Ripples</option>
            <option value="voronoi">Voronoi Cells</option>
            <option value="galaxy">Spiral Galaxy</option>
        </select>
        
        <label style="margin-top: 10px; display:block;">Fragment Shader Code:</label>
        <textarea id="shaderCode"></textarea>
        <button onclick="compileShader()">Compile & Run</button>
        <div id="errorLog" class="error"></div>
    </div>

    <!-- Load Three.js for easy WebGL handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, material, mesh;
        let clock = new THREE.Clock();

        const demos = {
            plasma: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "void main() {",
                "  vec2 uv = gl_FragCoord.xy / u_resolution.xy;",
                "  float wave = sin(uv.x * 12.0 + u_time) + cos(uv.y * 10.0 - u_time * 1.3) + sin((uv.x + uv.y) * 8.0 + u_time);",
                "  vec3 color = 0.5 + 0.5 * cos(wave + vec3(0.0, 2.0, 4.0));",
                "  gl_FragColor = vec4(color, 1.0);",
                "}"
            ].join("\n"),
            circles: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "void main() {",
                "  vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);",
                "  float d = length(p);",
                "  float rings = 0.5 + 0.5 * cos(d * 22.0 - u_time * 3.0);",
                "  vec3 color = mix(vec3(0.02, 0.03, 0.10), vec3(0.1, 0.85, 1.0), rings);",
                "  gl_FragColor = vec4(color, 1.0);",
                "}"
            ].join("\n"),
            rings: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "void main() {",
                "  vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / u_resolution.y;",
                "  float d = length(p);",
                "  float a = atan(p.y, p.x);",
                "  float line = 0.5 + 0.5 * cos(d * 30.0 - u_time * 2.5 + sin(a * 6.0 + u_time));",
                "  vec3 color = 0.5 + 0.5 * cos(6.2831 * (line + vec3(0.0, 0.33, 0.67)));",
                "  gl_FragColor = vec4(color * (1.0 - smoothstep(0.1, 1.4, d)), 1.0);",
                "}"
            ].join("\n"),
            aurora: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "void main() {",
                "  vec2 uv = gl_FragCoord.xy / u_resolution.xy;",
                "  float band = sin(uv.x * 8.0 + u_time * 0.7 + sin(uv.x * 17.0 - u_time) * 0.8) * 0.12 + 0.58;",
                "  float glow = exp(-abs(uv.y - band) * 14.0) + 0.45 * exp(-abs(uv.y - band - 0.12) * 20.0);",
                "  vec3 sky = mix(vec3(0.01, 0.02, 0.10), vec3(0.02, 0.12, 0.18), uv.y);",
                "  vec3 aurora = 0.5 + 0.5 * cos(uv.x * 5.0 + u_time + vec3(0.0, 2.0, 4.0));",
                "  gl_FragColor = vec4(sky + aurora * glow * 0.8, 1.0);",
                "}"
            ].join("\n"),
            starfield: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "float hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }",
                "void main() {",
                "  vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;",
                "  float r = length(uv);",
                "  float a = atan(uv.y, uv.x);",
                "  float stars = 0.0;",
                "  for (int i = 0; i < 4; i++) {",
                "    float layer = float(i) + 1.0;",
                "    vec2 p = vec2(a * (3.0 + layer) + u_time * (0.12 * layer), 1.0 / max(r, 0.04) + u_time * (0.7 * layer));",
                "    vec2 cell = floor(p * 18.0);",
                "    vec2 f = fract(p * 18.0) - 0.5;",
                "    float star = (1.0 - smoothstep(0.0, 0.12, length(f))) * step(0.84, hash21(cell + layer));",
                "    stars += star * (0.35 + 0.2 * layer);",
                "  }",
                "  vec3 color = vec3(0.02, 0.03, 0.09) + stars * vec3(0.55, 0.8, 1.0);",
                "  gl_FragColor = vec4(color, 1.0);",
                "}"
            ].join("\n"),
            checker: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "void main() {",
                "  vec2 uv = gl_FragCoord.xy / u_resolution.xy;",
                "  vec2 p = uv * vec2(16.0, 10.0) + vec2(u_time * 0.7, sin(u_time) * 0.4);",
                "  float tile = mod(floor(p.x) + floor(p.y), 2.0);",
                "  float glow = 0.5 + 0.5 * sin((p.x + p.y) * 1.8 - u_time * 2.0);",
                "  vec3 color = mix(vec3(0.03, 0.08, 0.16), vec3(0.1, 0.8, 0.75), tile * (0.35 + glow * 0.65));",
                "  gl_FragColor = vec4(color, 1.0);",
                "}"
            ].join("\n"),
            marble: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "void main() {",
                "  vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;",
                "  float pattern = sin(7.0 * uv.x + 4.0 * sin(5.0 * uv.y + u_time) + u_time * 0.8);",
                "  float vein = smoothstep(0.72, 0.98, abs(pattern));",
                "  vec3 stone = mix(vec3(0.02, 0.16, 0.20), vec3(0.18, 0.75, 0.72), 0.5 + 0.5 * pattern);",
                "  vec3 color = mix(stone, vec3(0.85, 0.98, 0.92), vein * 0.8);",
                "  gl_FragColor = vec4(color, 1.0);",
                "}"
            ].join("\n"),
            ripple: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "void main() {",
                "  vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;",
                "  float d = length(uv);",
                "  float wave = sin(d * 48.0 - u_time * 5.0);",
                "  float rings = 0.5 + 0.5 * wave;",
                "  float fade = exp(-d * 1.3);",
                "  vec3 deep = vec3(0.01, 0.08, 0.2);",
                "  vec3 light = vec3(0.12, 0.8, 0.95);",
                "  gl_FragColor = vec4(mix(deep, light, rings * fade), 1.0);",
                "}"
            ].join("\n"),
            voronoi: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "float hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }",
                "void main() {",
                "  vec2 uv = gl_FragCoord.xy / u_resolution.xy * 9.0;",
                "  vec2 cell = floor(uv);",
                "  vec2 local = fract(uv);",
                "  float nearest = 2.0;",
                "  float shade = 0.0;",
                "  for (int y = -1; y <= 1; y++) {",
                "    for (int x = -1; x <= 1; x++) {",
                "      vec2 neighbor = vec2(float(x), float(y));",
                "      vec2 point = 0.5 + 0.35 * sin(u_time + 6.2831 * vec2(hash21(cell + neighbor), hash21(cell + neighbor + 7.1)));",
                "      vec2 delta = neighbor + point - local;",
                "      float dist = length(delta);",
                "      if (dist < nearest) { nearest = dist; shade = hash21(cell + neighbor); }",
                "    }",
                "  }",
                "  vec3 color = 0.5 + 0.5 * cos(6.2831 * (shade + vec3(0.0, 0.33, 0.67)));",
                "  color *= 0.65 + 0.35 * smoothstep(0.0, 0.12, nearest);",
                "  gl_FragColor = vec4(color, 1.0);",
                "}"
            ].join("\n"),
            galaxy: [
                "uniform float u_time;",
                "uniform vec2 u_resolution;",
                "float hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }",
                "void main() {",
                "  vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;",
                "  float r = length(p);",
                "  float a = atan(p.y, p.x);",
                "  float arms = cos(a * 4.0 - r * 18.0 + u_time * 0.25);",
                "  float dust = 0.5 + 0.5 * sin(arms * 5.0 + sin(r * 36.0 - u_time));",
                "  float core = exp(-r * 8.0);",
                "  float stars = step(0.992, hash21(floor(p * 180.0)));",
                "  vec3 color = vec3(0.02, 0.01, 0.08) + (0.5 + 0.5 * cos(arms + vec3(0.0, 2.0, 4.0))) * dust * exp(-r * 2.5);",
                "  color += vec3(1.0, 0.75, 0.38) * core + vec3(0.7, 0.85, 1.0) * stars;",
                "  gl_FragColor = vec4(color, 1.0);",
                "}"
            ].join("\n")
        };

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            loadDemo();
            animate();

            window.addEventListener('resize', onWindowResize);
        }

        function loadDemo() {
            const type = document.getElementById('shaderSelect').value;
            document.getElementById('shaderCode').value = demos[type];
            compileShader();
        }

        function compileShader() {
            const fragmentShaderText = document.getElementById('shaderCode').value;
            const errorLog = document.getElementById('errorLog');
            errorLog.textContent = '';

            // Remove old mesh if it exists
            if (mesh) scene.remove(mesh);

            try {
                material = new THREE.ShaderMaterial({
                    uniforms: {
                        u_time: { value: 0.0 },
                        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
                    },
                    vertexShader: `
                        void main() {
                            gl_Position = vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: fragmentShaderText
                });

                const geometry = new THREE.PlaneGeometry(2, 2);
                mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);
            } catch (e) {
                errorLog.textContent = e.message;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (material && material.uniforms.u_time) {
                material.uniforms.u_time.value = clock.getElapsedTime();
            }
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (material && material.uniforms.u_resolution) {
                material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
            }
        }

        init();
    </script>
</body>
</html>
